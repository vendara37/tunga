                <div class="container px-5">
                    <!-- Contact form-->
                    <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                        <div class="text-center mb-5">
                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
                            <h1 class="fw-bolder">Get in touch</h1>
                            <p class="lead fw-normal text-muted mb-0">Let's work together!</p>
                        </div>
                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-8 col-xl-6">
                                <!-- * * * * * * * * * * * * * * *-->
                                <!-- * * * * * * *Contact Form * *-->
                                <!-- * * * * * * * * * * * * * * *-->
                                <div>
                                    <div class="mb-2">
                                        <label for="name" class="form-label">Full name</label>
                                        <input type="text" class="form-control" name="name" id="name" placeholder="Enter your name..."><span id="err_name"></span><br />
                                    </div>
                                    <div class="mb-2">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" name="email" id="email" placeholder="Enter your email address..."><span id="err_email"></span><br />
                                    </div>
                                    <div class="mb-2">
                                        <label for="phone" class="form-label">Phone number</label>
                                        <input id="phone" type="tel" class="form-control" placeholder="(123) 456-7890" ><span id="err_phn"></span><br />
                                    </div>
                                    <div class="mb-2">
                                        <label for="message" class="form-label">Message</label>
                                        <textarea class="form-control" name="message" id="message" rows="5"></textarea><span id="err_msg"></span><br />
                                        <input id="msgsrc" type="hidden" value="tunga_gh">
                                    </div>
                                    <div class="mb-2">
                                        <button id="sendbtn" class="btn btn-primary">SEND</button>
                                    </div>
                                    <div class="mb-2">
                                        <h3><span id="msg_out"></span></h3>
                                    </div>
                                </div>
                                
                            </div>
                        </div>

        <script src="js/scripts.js"></script>
		<script src="https://googleapis.com"></script>
        <script>
$(document).ready(function() {
	//-----------------------------------------------------
	//$("button").click(function(){
	$("#sendbtn").click(function() {				//(ajaxtest1(testnum1));
        var vis_name = $('#name').val();
        var msg_src = $('#msgsrc').val();
        var vis_email = $('#email').val();
        var vis_phn = $('#phone').val();
        var vis_msg = $('#message').val();
        var post_data = {
				'action1': 'msg_save',
                'vis_name': vis_name,
                'vis_email': vis_email,
                'vis_phone': vis_phn,
                'vis_msg': vis_msg,
                'msg_src': msg_src
        }
        $.ajax({
            type: 'POST',
            url: 'https://tunga.free.nf/vcentral/vcentral.php',
			//url: 'http://localhost/vcentral/vcentral.php',
			//url: 'http://localhost/tunga/includes/postmsg1.php',
			contentType: 'application/json',
			dataType: 'json',
            data: JSON.stringify (post_data),
			success: function(response) {
				var resp = response;
                if(resp.success=='true'){
                    $('#name').val('');
                    $('#email').val('');
                    $('#phone').val('');
                    $('#message').val('');
                    $('#err_name').text('');
                    $('#err_email').text('');
                    $('#err_phone').text('');
                    $('#err_msg').text('');
                    $('#msg_out').text('message received, ID: ' + resp.msg_id + '. Thank you for getting in touch');
                }else{
                    $('#err_name').text(resp.err_name);
                    $('#err_email').text(resp.err_email);
                    $('#err_phone').text(resp.err_phn);
                    $('#err_msg').text(resp.err_msg);
                    $('#msg_out').text('Unable to save, please check your input');
                }
			},
			error: function(xhr, status, error) {
				$("#msg_out").text("krankja: " + xhr.responseText);
		//    console.log(xhr.responseText);
			}
		});
	}); 
});

//trcpost('tunga_gh', 'ct');
//=================================TRACEUR================================================

        </script>
